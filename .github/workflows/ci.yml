name: Enterprise CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Java 21 & Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests & Build
        run: |
          cd server
          mvn clean test
          mvn compile

  frontend-test:
    name: Frontend React 19 & Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install Dependencies
        run: |
          cd client
          npm install

      - name: Run Linter (Oxlint)
        run: |
          cd client
          npm run lint

      - name: Run Unit & Integration Tests (Vitest)
        run: |
          cd client
          npm test

      - name: Build Production Bundle
        run: |
          cd client
          npm run build
